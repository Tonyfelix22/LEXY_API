version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DEBUG=True
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DB_HOST=db
      - DB_NAME=LEXYDB
      - DB_USER=postgres
      - DB_PASSWORD=Password26
      - DB_PORT=5432
      - DOCKER_CONTAINER=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./staticfiles:/app/staticfiles
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=LEXYDB
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Password26
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
